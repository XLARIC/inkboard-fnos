services:
  inkboard:
    build: .
    restart: unless-stopped
    ports:
      - "${INKBOARD_BIND_IP:-127.0.0.1}:18888:18888"
    volumes:
      - inkboard-config:/config
      - inkboard-data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    mem_limit: 128m
    cpus: 0.5
volumes:
  inkboard-config:
  inkboard-data:
