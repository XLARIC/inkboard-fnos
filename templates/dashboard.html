<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="InkBoard"><title>{{.Title}}</title><link rel="stylesheet" href="/assets/board.css?v={{.Display.Version}}{{if .Display.Demo}}&amp;qa={{unix .Display.Now}}{{end}}">{{if not .Basic}}<link rel="stylesheet" href="/assets/dashboard-modern.css?v={{.Display.Version}}{{if .Display.Demo}}&amp;qa={{unix .Display.Now}}{{end}}">{{end}}<link rel="apple-touch-icon" href="/assets/icon.png"><script src="/assets/dashboard.js?v={{.Display.Version}}{{if .Display.Demo}}&amp;qa={{unix .Display.Now}}{{end}}" defer></script></head><body class="display board {{if .Basic}}ink legacy{{else}}mobile{{end}}" data-basic="{{.Basic}}" data-history="{{.History}}">
<main id="book" tabindex="-1" aria-label="看板：左右滑动或使用翻页键切换">{{template "groups" .}}</main>
<noscript><p class="no-script">开启浏览器 JavaScript 可使用局部更新与滑动翻页。<a href="/admin">管理设置</a></p></noscript>
<div id="board-notice" class="board-notice" role="status" hidden></div>
</body></html>
